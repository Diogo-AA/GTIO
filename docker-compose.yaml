services:
  frontend:
      build:
        context: frontend/
        dockerfile: Dockerfile
        args:
          VITE_API_BASE: http://localhost:8000
          VITE_AUTH0_DOMAIN: dev-bd8co7uzp2no173l.us.auth0.com
          VITE_AUTH0_CLIENT_ID: 7jmRrkifuWLtHgDzjfk0FKZF56RCnvje
          VITE_AUTH0_AUDIENCE: https://api.ot-votacion.com
      ports:
        - "5500:80"
      depends_on:
        - backend

  backend:
    build:
      context: Backend/
      dockerfile: Dockerfile
    networks:
      - kong-net
      - default
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:${PUERTO_API-8080}
      - Db__ConnString=server=bbdd_votacion_mysql;port=${PUERTO_MYSQL-3306};uid=user;pwd=pass;database=votacion_db;
      - Auth0__Domain=dev-bd8co7uzp2no173l.us.auth0.com
      - Auth0__Audience=https://api.ot-votacion.com
    env_file:
      - path: .env
        required: false
    volumes:
      - ~/.aspnet/https:/https:ro
    depends_on:
      - base_datos

  base_datos:
    image: mysql:8.4
    container_name: bbdd_votacion_mysql
    restart: unless-stopped
    networks:
      - kong-net
    env_file:
      - BBDD/.env
    ports:
      - "${PUERTO_MYSQL-3306}:3306"
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./BBDD/init:/docker-entrypoint-initdb.d:ro

  kong-dbless:
    image: '${GW_IMAGE:-kong/kong-gateway:3.7}'
    container_name: kong-dbless-readonly
    read_only: true
    restart: unless-stopped
    networks:
      - kong-net
    volumes:
      - ./Kong:/kong/declarative/:ro
    tmpfs:
      - /tmp
      - /var/run/kong
    environment:
      KONG_PREFIX: /var/run/kong
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"

networks:
  kong-net:

volumes:
  datos_mysql:
