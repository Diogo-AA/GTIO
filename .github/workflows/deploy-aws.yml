name: CI/CD — Deploy to AWS ECS

on:
  push:
    branches: ["main", "pre", "pro"]
    paths:
      - "Backend/**"
      - "frontend/**"
      - "terraform/**"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch: # Permite lanzarlo manualmente eligiendo el entorno
    inputs:
      environment:
        description: 'Entorno a desplegar'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - pre
          - pro

env:
  AWS_REGION: us-east-1
  # Determinar entorno: si es manual usa el input, si es automático por rama: main->dev, pre->pre, pro->pro
  TARGET_ENV: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'dev') || github.ref_name }}

  # Variables dinámicas con el sufijo del entorno (ej: gtio-backend-dev)
  ECR_REPOSITORY_BACKEND: gtio-backend-${{ github.event.inputs.environment || (github.ref_name == 'main' && 'dev') || github.ref_name }}
  ECR_REPOSITORY_FRONTEND: gtio-frontend-${{ github.event.inputs.environment || (github.ref_name == 'main' && 'dev') || github.ref_name }}
  ECS_CLUSTER: gtio-cluster-${{ github.event.inputs.environment || (github.ref_name == 'main' && 'dev') || github.ref_name }}
  ECS_SERVICE: gtio-app-svc-${{ github.event.inputs.environment || (github.ref_name == 'main' && 'dev') || github.ref_name }}

jobs:
  # ─── 1. Tests unitarios ────────────────────────────────────────────────────
  test:
    name: Tests Unitarios (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore Tests/Tests.csproj

      - name: Ejecutar tests
        run: dotnet test Tests/Tests.csproj --no-restore --verbosity normal --collect:"XPlat Code Coverage"

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/coverage.cobertura.xml"
          retention-days: 7

  # ─── 2. Terraform (delegado a HCP Terraform Cloud) ─────────────────────────
  # Lanzamos terraform desde GitHub Actions, pero como el backend es `cloud {}`,
  # la ejecución real ocurre en los runners de HCP Terraform Cloud (workspace
  # GTIO-WORKSPACE-<env>) con las variables que ya están configuradas allí
  # (db_user, db_password, alarm_email, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
  # AWS_SESSION_TOKEN). Esto garantiza que la infraestructura está aplicada
  # antes de intentar construir/desplegar contenedores.
  terraform:
    name: Terraform Apply (${{ github.event.inputs.environment || (github.ref_name == 'main' && 'dev') || github.ref_name }})
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          cli_config_credentials_token: ${{ secrets.TFC_API_TOKEN }}

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive .

      - name: Terraform init
        working-directory: terraform/environments/${{ env.TARGET_ENV }}
        run: terraform init

      - name: Terraform validate
        working-directory: terraform/environments/${{ env.TARGET_ENV }}
        run: terraform validate

      - name: Terraform apply (auto-approve, ejecuta remoto en HCP)
        working-directory: terraform/environments/${{ env.TARGET_ENV }}
        run: terraform apply -auto-approve -input=false

  # ─── 3a. Build & Push Backend a ECR ────────────────────────────────────────
  build-backend:
    name: Build & Push Backend a ECR
    runs-on: ubuntu-latest
    needs: terraform
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag y push de la imagen a ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG ./Backend
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ─── 3b. Build & Push Frontend a ECR ──────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend a ECR
    runs-on: ubuntu-latest
    needs: terraform
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag y push de la imagen a ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_BASE=${{ secrets.VITE_API_BASE || '/api' }} \
            --build-arg VITE_AUTH0_DOMAIN=${{ secrets.VITE_AUTH0_DOMAIN }} \
            --build-arg VITE_AUTH0_CLIENT_ID=${{ secrets.VITE_AUTH0_CLIENT_ID }} \
            --build-arg VITE_AUTH0_AUDIENCE=${{ secrets.VITE_AUTH0_AUDIENCE }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG ./frontend
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ─── 4. Deploy a ECS ───────────────────────────────────────────────────────
  deploy:
    name: Deploy a ECS Fargate
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtener Task Definition actual
        run: |
          aws ecs describe-task-definition \
            --task-definition gtio-app-${{ env.TARGET_ENV }} \
            --query taskDefinition \
            > task-definition.json

      - name: Actualizar imagen del backend en la Task Definition
        id: task-def-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ needs.build-backend.outputs.image }}

      - name: Actualizar imagen del frontend en la Task Definition
        id: task-def-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-backend.outputs.task-definition }}
          container-name: frontend
          image: ${{ needs.build-frontend.outputs.image }}

      - name: Desplegar nueva Task Definition en ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-frontend.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
