services:
  - name: backend-api
    url: http://backend:8080
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          uri_param_names: []
      - name: rate-limiting
        config:
          minute: 50
          policy: local
      - name: cors
        config:
          origins:
            - http://localhost:5500
            - http://127.0.0.1:5500
          methods:
            - GET
            - POST
            - OPTIONS
          headers:
            - Accept
            - Content-Type
            - Authorization
          exposed_headers:
            - X-Kong-Proxy-Latency
          max_age: 3600
          credentials: true
    routes:
      - name: api-protegidas
        paths:
          - /usuarios
          - /votos
          - /galas
        strip_path: false