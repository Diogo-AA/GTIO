_format_version: "3.0"
services:
  - name: backend-api
    url: http://backend:8080 
    plugins:
      - name: rate-limiting
        config:
          minute: 50
          policy: local
      - name: cors
        config:
          origins:
            - http://localhost:5500
            - http://127.0.0.1:5500
          methods:
            - GET
            - POST
            - OPTIONS
          headers:
            - Accept
            - Content-Type
            - Authorization
          exposed_headers:
            - X-Kong-Proxy-Latency
          max_age: 3600
          credentials: true
    routes:
      - name: backend-routes
        paths:
          - /auth
          - /usuarios
          - /votos
          - /galas
        strip_path: false